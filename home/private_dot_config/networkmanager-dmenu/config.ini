[dmenu]
dmenu_command = rofi -dmenu -i
highlight = True
compact = False
wifi_chars = ▂▄▆█
format = {name}  {sec}  {bars}
list_saved = False
prompt = Networks

[dmenu_passphrase]
obscure = True

[editor]
terminal = ghostty
gui_if_available = True
gui = nm-connection-editor

[nmdm]
rescan_delay = 5
notification_timeout = 5
show_notifications = True
