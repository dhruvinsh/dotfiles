#################################
# Backend (Intel iGPU, Mesa)
#################################
# glx has the best blur/color-inversion performance and is well supported by
# Mesa's i915/iris driver. egl is a newer, sometimes lighter-weight
# alternative on Mesa if glx shows artifacts; xrender is the safe fallback.
backend = "glx";
# backend = "egl";
# backend = "xrender";

vsync = true;
use-damage = true;

# Unredirect fullscreen windows (videos, games) for a small perf win.
unredir-if-possible = true;
unredir-if-possible-delay = 0;

#################################
# Detection helpers
#################################
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;

#################################
# Rounded corners
#################################
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "fullscreen"
];

#################################
# Shadows
#################################
shadow = true;
shadow-radius = 12;
# v13 fixed double-applying shadow-opacity — 0.65 is a bit lighter than before.
shadow-opacity = 0.65;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-exclude = [
  "class_g = 'Polybar'",
  "class_g = 'i3-frame'",
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "_GTK_FRAME_EXTENTS@:c",
  "_NET_WM_STATE@[0]:32a *= '_NET_WM_STATE_HIDDEN'"
];

#################################
# Fading
#################################
fading = true;
fade-in-step = 0.08;
fade-out-step = 0.08;
fade-delta = 12;
fade-exclude = [
  "window_type = 'tooltip'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'"
];

#################################
# Opacity
#################################
inactive-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
active-opacity = 1.0;
focus-exclude = [
  "class_g = 'i3lock'",
  "class_g = 'Rofi'"
];

opacity-rule = [
  "100:class_g = 'firefox'",
  "100:class_g = 'Firefox'",
  "100:class_g = 'Google-chrome'",
  "100:class_g = 'Brave-browser'",
  "100:class_g = 'Rofi'",
  "100:class_g = 'Polybar'",
  "100:class_g = 'i3lock'",
  "100:class_g = 'teams-for-linux'",
  "100:class_g = 'Slack'",
  "100:class_g = 'discord'",
  "100:class_g = 'mpv'",
  "100:class_g = 'vlc'",
  "100:fullscreen",
  "100:window_type = 'tooltip'",
  "100:window_type = 'popup_menu'",
  "100:window_type = 'dropdown_menu'",
  "100:window_type = 'menu'"
];

#################################
# Blur
#################################
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-fixed = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "window_type = 'tooltip'",
  "window_type = 'popup_menu'",
  "window_type = 'dropdown_menu'",
  "class_g = 'i3lock'",
  "class_g = 'slop'",
  "_GTK_FRAME_EXTENTS@:c",
  "fullscreen"
];

#################################
# Window types
# (v13 prefers `rules = (...)`; keeping wintypes is fine if you don't also
# set `rules` — mixing them makes the old options no-ops with warnings.)
#################################
wintypes:
{
  tooltip = { fade = true; shadow = false; opacity = 1.0; focus = true; full-shadow = false; };
  dock = { shadow = false; clip-shadow-above = true; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; shadow = true; fade = false; };
  dropdown_menu = { opacity = 1.0; shadow = true; fade = false; };
  menu = { opacity = 1.0; shadow = false; };
  utility = { shadow = false; };
  notification = { shadow = true; };
};
