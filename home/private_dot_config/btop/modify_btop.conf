#!/bin/sh
# btop rewrites btop.conf in full (every key, its own comments) on each exit, so a
# tracked copy drifts with every btop upgrade or options-menu change. Pin only the
# keys below; everything else passes through as btop wrote it. An empty/missing file
# gets just these keys, and btop fills in its defaults on first exit.
# Values compare case-insensitively: older btop writes False/True.
exec awk '
BEGIN {
  n = split("color_theme theme_background", keys, " ")
  want["color_theme"] = "\"custom-btop\""
  want["theme_background"] = "false"
}
match($0, /^[a-z0-9_]+ = /) {
  k = substr($0, 1, RLENGTH - 3)
  if (k in want) {
    seen[k] = 1
    if (tolower(substr($0, RLENGTH + 1)) != tolower(want[k])) $0 = k " = " want[k]
  }
}
{ print }
END { for (i = 1; i <= n; i++) if (!(keys[i] in seen)) print keys[i] " = " want[keys[i]] }
'
