# Handy probes every ALSA PCM directly at startup. If that overlaps
# WirePlumber creating its ALSA nodes, a sink fails with "Device or resource
# busy" (seen on the Apple USB-C headphone adapter). Start Handy once the
# audio graph is up: a default sink exists, plus a short settle delay.
[Unit]
Wants=wireplumber.service
After=wireplumber.service

[Service]
ExecStartPre=-/usr/bin/timeout 15 /usr/bin/sh -c 'until wpctl inspect @DEFAULT_AUDIO_SINK@ >/dev/null 2>&1; do sleep 0.5; done'
ExecStartPre=/usr/bin/sleep 2
