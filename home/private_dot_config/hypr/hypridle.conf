# Hyprland runs a Lua config: hyprctl dispatchers must use hl.dsp.* syntax
# (legacy `hyprctl dispatch dpms off` is rejected).
# CAUTION: hl.dsp.dpms() with no/unknown action TOGGLES the display. Only the
# documented "disable" action is used here; waking is left to Hyprland
# (misc.key_press_enables_dpms / mouse_move_enables_dpms in hyprland.lua).

general {
    lock_cmd = pidof hyprlock || hyprlock       # avoid starting multiple hyprlock instances.
    before_sleep_cmd = loginctl lock-session    # lock before suspend.
}

listener {
    timeout = 300                                 # 5min
    on-timeout = loginctl lock-session            # lock screen when timeout has passed
}

listener {
    timeout = 600                                 # 10min: screen off, any key/mouse wakes it
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
}
