# chezmoixternal -*- mode: yaml -*-
# vim: set filetype=yaml

# prettier-ignore
openscadVersion  : "2021.01"

# Work PC monitors (two identical ViewSonics), matched by description
# ("make model serial") in hyprland.lua and waybar so cable/port swaps don't matter.
workMonitors:
  left: "ViewSonic Corporation VX3276-QHD V9W222140992" # DP, holds workspaces 7-8
  right: "ViewSonic Corporation VX3276-QHD V9W194342016" # HDMI, 60Hz max

# Flat Remix icon accent (.chezmoitemplates/icon-theme). Dark/Light follows
# colorScheme.variant, or the live mode on Arch (theme-mode). Colours: Black Blue
# Brown Cyan Green Grey Magenta Orange Red Teal Violet Yellow.
flatRemixColor: Blue

# Docker bridge subnets (/etc/docker/daemon.json on Arch/Ubuntu/Fedora).
# The pool's /20 split into /26s gives 64 compose networks of 62 hosts each.
docker:
  bip: "192.168.223.1/24"
  poolBase: "192.168.224.0/20"
  poolSize: 26
